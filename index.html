    <!-- ═══ TECHNICAL DESIGN SYSTEM TOKENS ═══ -->
    <style>
      :root {
        --color-canvas: #f8fafc;
        --color-surface-1: #ffffff;
        --color-surface-2: #f1f5f9;
        --color-surface-3: #e2e8f0;
        --color-hairline: #e2e8f0;
        --color-hairline-strong: #cbd5e1;

        --color-ink-muted: #475569;
        --color-ink-faint: #64748b;
        --color-accent: #0284c7;
        --color-accent-hover: #0369a1;
        --color-accent-subtle: rgba(2, 132, 199, 0.08);
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 14px;
        --radius-full: 9999px;
      }
      .dark {
        --color-canvas: #090a0f;
        --color-surface-1: #111319;
        --color-surface-2: #181b24;
        --color-surface-3: #222633;
        --color-hairline: #262a36;
        --color-hairline-strong: #3d4457;

        --color-ink-muted: #94a3b8;
        --color-ink-faint: #64748b;
        --color-accent: #38bdf8;
        --color-accent-hover: #7dd3fc;
        --color-accent-subtle: rgba(56, 189, 248, 0.08);
      }
    </style>

    <!-- Flash-of-unstyled-theme prevention: runs BEFORE React hydration -->
    <script>
      (function() {
        var stored = localStorage.getItem('theme');
        var theme = stored;
        if (!theme || (stored !== 'light' && stored !== 'dark')) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.classList.toggle('light', theme === 'light');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
